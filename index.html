<!doctype html>
<html class="js no-touch inline-media no-reduced-motion enhanced enhanced-rt desktop" lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Apple Lotus · Internal Study</title>
  <style>
    :root{color-scheme:dark;background:#000}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f5f5f7}#app{position:fixed;inset:0;height:100vh;height:100dvh;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}.boot-loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#000}.boot-card{width:min(290px,76vw);display:grid;justify-items:center;text-align:center}.boot-mark{width:32px;height:32px;margin-bottom:22px;border:1px solid rgba(255,255,255,.28);border-radius:11px;display:grid;place-items:center}.boot-mark:before{content:"";width:7px;height:7px;border-radius:50%;background:#d46b38;box-shadow:0 0 18px rgba(212,107,56,.55)}.boot-eyebrow{font-size:10px;line-height:1.3;letter-spacing:.22em;color:#85858b}.boot-loading strong{display:block;margin-top:9px;font-size:17px;line-height:1.35;font-weight:560}.boot-percent{margin-top:8px;font-size:11px;color:#77777d;font-variant-numeric:tabular-nums}.boot-loading progress{display:block;width:100%;height:3px;margin-top:18px;border:0;appearance:none;background:transparent}.boot-loading progress::-webkit-progress-bar{background:#1d1d20;border-radius:99px}.boot-loading progress::-webkit-progress-value{background:#f5f5f7;border-radius:99px;transition:width .25s ease}.boot-note{margin-top:14px;font-size:11px;line-height:1.5;color:#66666c}.is-ready .boot-loading{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease,visibility .55s}
  </style>
</head>
<body>
  <main id="app">
    <div class="product-viewer-component" data-library-path="/apple/libs/lotus.min.js" data-mode="3d" role="region" aria-label="Apple Lotus product viewer">
      <div class="product-viewer-enhanced viewer--loading" id="product-gallery" data-product-viewer-id="product-gallery" data-rt-library-path="/apple/libs/lotus.min.js" data-rt-scenes-path="/apple" data-rt-scenes='{"large":"iPhone17Pro_US_L","medium":"iPhone17Pro_US_M","small":"iPhone17Pro_US_S"}' data-rt-states="{}" data-rt-analytics="{}" data-matching-angles='[{"ptAngle":"PT_backLeft","interactiveAngle":"backLeft"}]' data-pt-big='["PT_backLeft"]' data-pt-smol='["PT_backLeft"]'>
        <div class="viewer-wrapper">
          <div class="product-viewer-enhanced-container product-viewer-canvas entice"></div>
          <div class="viewer-hit-area"></div>
          <div class="loader"><div class="loader-progress-indicator"></div><div class="preview-image"></div></div>
        </div>
      </div>
    </div>
    <div class="loading boot-loading" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true"></div>
        <span class="boot-eyebrow">APPLE LOTUS · INTERNAL STUDY</span>
        <strong>正在载入官方场景</strong>
        <span class="boot-percent">0%</span>
        <progress max="100" value="0" aria-label="场景载入进度"></progress>
        <span class="boot-note">首次载入需要下载高精度产品资源</span>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
